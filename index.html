<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>WebOS Phone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; background:#1a1a22; }

  #phone { position:relative; width:100vw; height:100vh; overflow:hidden; background:#0a0a0f; color:#fff; }
  @media (min-width:600px) {
    body { display:grid; place-items:center; }
    #phone { width:390px; height:844px; border-radius:48px; box-shadow:0 0 0 12px #000, 0 30px 80px #0008; }
  }

  #wallpaper { position:absolute; inset:0; background:linear-gradient(160deg,#1a0033,#003344 50%,#002233); transition:filter .5s, transform .5s; }
  #wallpaper.blur { filter:blur(20px) brightness(.5); transform:scale(1.1); }

  #statusbar { position:absolute; top:0; left:0; right:0; height:44px; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:13px; font-weight:600; pointer-events:none; }
  #icons { display:flex; gap:6px; align-items:center; }
  .bar { width:16px; height:11px; border:1.5px solid #fff; border-radius:3px; position:relative; }
  .bar::after { content:''; position:absolute; inset:1.5px; right:5px; background:#fff; border-radius:1px; }

  #lockscreen { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .4s, transform .4s; }
  #lockscreen.hidden { opacity:0; transform:translateY(-100%); pointer-events:none; }
  #lock-time { font-size:76px; font-weight:200; letter-spacing:-2px; }
  #lock-date { font-size:16px; opacity:.8; margin-top:-6px; }

  #slider { position:absolute; bottom:60px; left:30px; right:30px; height:60px; background:#ffffff1a; border-radius:30px; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(10px); overflow:hidden; }
  #slider-fill { position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#4da3ff55,#4da3ffaa); border-radius:30px 0 0 30px; pointer-events:none; }
  #slider-handle { position:absolute; left:5px; top:5px; width:50px; height:50px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; font-size:22px; cursor:grab; touch-action:none; transition:left .25s cubic-bezier(.32,.72,0,1); box-shadow:0 2px 10px #0006; z-index:2; }
  #slider-handle.dragging { transition:none; cursor:grabbing; }
  #slider-label { font-size:14px; opacity:.7; pointer-events:none; z-index:1; }

  /* ==================== HOME & APP EDITING ==================== */
  #home { position:absolute; inset:0; padding:70px 22px 110px; display:grid; grid-template-columns:repeat(4,1fr); gap:22px 14px; align-content:start; transition:opacity .4s; overflow-y:auto; }
  #home.hidden { opacity:0; pointer-events:none; }
  
  .app, .widget { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; transition:transform .15s; position:relative; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .app:active { transform:scale(.88); }
  .app.dragging, .widget.dragging { opacity:0.3; transform:scale(1.05); z-index: 10; }
  .app-icon { width:58px; height:58px; border-radius:14px; display:grid; place-items:center; font-size:28px; box-shadow:0 4px 14px #0006; pointer-events:none; }
  .app-name { font-size:11px; opacity:.95; text-shadow:0 1px 3px #0008; text-align:center; pointer-events:none; }

  /* Widgets */
  .widget { grid-column: span 2; background:#ffffff1a; backdrop-filter:blur(20px); border-radius:20px; padding:16px; }
  .widget-time { font-size:36px; font-weight:300; letter-spacing:-1px; }
  .widget-date { font-size:12px; opacity:.8; margin-top:-2px; }
  .widget-weather { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:13px; }
  .widget-icon { font-size:24px; }

  /* Jiggle Animation */
  @keyframes jiggle {
    0% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
    100% { transform: rotate(-2deg); }
  }
  #home.edit-mode .app:not(.dragging), #home.edit-mode .widget:not(.dragging) { animation: jiggle 0.25s infinite; }
  
  /* Delete Button */
  .del-badge { display:none; position:absolute; top:-6px; left:-6px; width:24px; height:24px; background:#ff375f; color:#fff; border-radius:50%; font-size:14px; font-weight:bold; line-height:24px; text-align:center; box-shadow:0 2px 6px #0008; z-index:20; cursor:pointer; pointer-events:auto; }
  #home.edit-mode .del-badge { display:block; }
  #home.edit-mode .app, #home.edit-mode .widget { cursor:grab; }
  #home.edit-mode .app:active, #home.edit-mode .widget:active { transform:scale(1); }

  #appview { position:absolute; inset:0; z-index:80; background:#111; display:flex; flex-direction:column; transform:translateY(100%); opacity:0; transition:transform .35s cubic-bezier(.32,.72,0,1), opacity .25s; }
  #appview.open { transform:translateY(0); opacity:1; }
  #appview header { height:60px; padding:44px 16px 0; display:flex; align-items:center; gap:12px; background:#1c1c22; font-weight:600; flex-shrink:0; border-bottom:1px solid #ffffff0a; }
  #appview header button { background:none; border:none; color:#4da3ff; font-size:16px; cursor:pointer; padding:8px; display:flex; align-items:center; }
  #app-content { flex:1; padding:20px; overflow-y:auto; color:#ddd; font-size:15px; line-height:1.6; position:relative; }
  #app-content h2 { margin-bottom:12px; color:#fff; }
  #app-content::-webkit-scrollbar { width:0; }

  .switch { position:relative; display:inline-block; width:50px; height:30px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider-sw { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#333; transition:.3s; border-radius:30px; }
  .slider-sw:before { position:absolute; content:""; height:26px; width:26px; left:2px; bottom:2px; background:#fff; transition:.3s; border-radius:50%; }
  input:checked + .slider-sw { background:#34c759; }
  input:checked + .slider-sw:before { transform:translateX(20px); }

  .btn { display:block; padding:12px 24px; border:none; border-radius:30px; color:#fff; font-size:15px; cursor:pointer; font-weight:600; text-align:center; transition:opacity .2s; }
  .btn:active { opacity:.7; }

  #dock { position:absolute; bottom:20px; left:20px; right:20px; height:76px; background:#ffffff14; backdrop-filter:blur(20px); border-radius:26px; display:flex; justify-content:space-around; align-items:center; padding:0 8px; transition:opacity .4s, transform .4s; z-index:40; }
  #dock.hidden { opacity:0; transform:translateY(120%); pointer-events:none; }
  #dock .app-icon { width:52px; height:52px; border-radius:13px; font-size:26px; }

  #indicator { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:160px; height:44px; z-index:9999; cursor:grab; display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px; touch-action:none; }
  #indicator::after { content:''; display:block; width:130px; height:5px; border-radius:3px; background:#fff9; transition:background .2s; }
  #indicator:active::after { background:#fff; }

  /* File Manager Styles */
  .file-row { display:flex; align-items:center; padding:12px; border-bottom:1px solid #ffffff0a; cursor:pointer; transition:background 0.2s; }
  .file-row:active { background:#ffffff14; }
  .file-icon { font-size:24px; margin-right:12px; }
  .file-info { flex:1; overflow:hidden; }
  .file-name { font-size:15px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-size { font-size:12px; opacity:0.6; }
  .del-btn { background:#ff375f22; color:#ff375f; border:none; padding:6px 10px; border-radius:8px; font-size:12px; cursor:pointer; }

  /* Keyboard Styles */
  #kb { position:absolute; left:0; right:0; bottom:0; z-index:340; height:286px; padding:8px 4px 44px; background:#1c1c22f2; backdrop-filter:blur(20px); border-top:1px solid #ffffff14; display:flex; flex-direction:column; gap:8px; transform:translateY(105%); transition:transform .25s cubic-bezier(.32,.72,0,1); }
  #kb.show { transform:translateY(0); }
  .kb-row { flex:1; display:flex; gap:5px; min-height:0; }
  .k { flex:1; min-width:0; border:none; border-radius:7px; background:#4a4a54; color:#fff; font-size:20px; font-family:inherit; cursor:pointer; padding:0; box-shadow:0 1px 0 #0008; display:grid; place-items:center; }
  .k:active { background:#6a6a76; }
  .k.sp { background:#2e2e36; font-size:15px; } .k.sp:active { background:#4a4a54; }
  .k.sp.on { background:#fff; color:#000; } .k.go { background:#0a84ff; }
  .kb-emo { flex:1; display:grid; grid-template-columns:repeat(8,1fr); gap:2px; overflow-y:auto; align-content:start; touch-action:pan-y; }
  .kb-emo .k { background:none; box-shadow:none; font-size:24px; height:42px; }

  /* Passcode UI */
  #passui { position:absolute; inset:0; z-index:350; display:none; flex-direction:column; align-items:center; justify-content:center; background:#0a0a0fee; backdrop-filter:blur(24px); }
  #passui.show { display:flex; }
  #pass-title { font-size:20px; font-weight:600; } #pass-sub { font-size:13px; opacity:.7; margin-top:6px; min-height:18px; text-align:center; padding:0 30px; }
  #pass-dots { display:flex; gap:16px; margin:26px 0 34px; }
  #pass-dots i { width:14px; height:14px; border-radius:50%; border:1.5px solid #fff; transition:background .1s; }
  #pass-dots i.on { background:#fff; }
  #pass-dots.shake { animation:shake .4s; }
  @keyframes shake { 20%,60% { transform:translateX(-10px); } 40%,80% { transform:translateX(10px); } }
  #pass-pad { display:grid; grid-template-columns:repeat(3,72px); gap:16px 22px; }
  #pass-pad button { width:72px; height:72px; border-radius:50%; border:none; background:#ffffff1f; color:#fff; font-size:28px; font-weight:300; cursor:pointer; }
  #pass-pad button:active { background:#ffffff55; }
</style>
</head>
<body>
<div id="phone">
  <div id="wallpaper" class="blur"></div>

  <div id="statusbar">
    <span id="clock">9:41</span>
    <div id="icons"><div class="bar"></div><span style="font-size:11px">5G</span></div>
  </div>

  <div id="lockscreen">
    <div id="lock-time">9:41</div>
    <div id="lock-date">Tuesday, October 29</div>
    <div id="slider">
      <div id="slider-fill"></div>
      <div id="slider-handle">➜</div>
      <span id="slider-label">Slide to unlock</span>
    </div>
  </div>

  <div id="home" class="hidden"></div>

  <div id="appview">
    <header><button id="back">‹ Home</button><span id="app-title"></span></header>
    <div id="app-content"></div>
  </div>

  <div id="dock" class="hidden"></div>
  <div id="kb"></div>
  <div id="passui">
    <div id="pass-title"></div><div id="pass-sub"></div>
    <div id="pass-dots"></div>
    <div id="pass-pad"></div>
  </div>
  <div id="indicator"></div>
</div>

<script>
/* ==================== AUDIO ENGINE ==================== */
const AudioEngine = (() => {
  let ctx;
  const init = () => { 
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); 
      if (ctx.state === 'suspended') ctx.resume(); 
    } catch(e) {}
  };
  const play = (freq, type, duration, volume = 0.1) => {
    if (typeof DevOpts !== 'undefined' && DevOpts.muted()) return;
    if (!ctx || ctx.state !== 'running') return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(volume, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  };
  return {
    init,
    click: () => play(800, 'sine', 0.05, 0.05),
    pop: () => { play(600, 'sine', 0.1, 0.1); setTimeout(() => play(800, 'sine', 0.1, 0.1), 50); },
    swoosh: () => play(200, 'triangle', 0.3, 0.1),
    error: () => play(150, 'sawtooth', 0.3, 0.1),
    success: () => { play(400, 'sine', 0.1, 0.1); setTimeout(() => play(600, 'sine', 0.1, 0.1), 100); setTimeout(() => play(800, 'sine', 0.2, 0.1), 200); }
  };
})();
document.addEventListener('pointerdown', () => AudioEngine.init());

/* ==================== PASSCODE SYSTEM ==================== */
const Pass = {
  get: () => { try { return JSON.parse(localStorage.getItem('webos-pass')); } catch { return null; } },
  has: () => !!Pass.get(),
  set: (code) => { const salt = Math.random().toString(36).slice(2); localStorage.setItem('webos-pass', JSON.stringify({ salt, hash: btoa(salt + ':' + code) })); },
  verify: (code) => { const p = Pass.get(); return p && btoa(p.salt + ':' + code) === p.hash; },
  clear: () => localStorage.removeItem('webos-pass')
};

const PassUI = (() => {
  const $ = id => document.getElementById(id);
  let res = null, buf = '';
  const dots = () => $('pass-dots').innerHTML = Array.from({ length: 4 }, (_, i) => `<i class="${i < buf.length ? 'on' : ''}"></i>`).join('');
  const finish = v => { const r = res; res = null; if (r) r(v); };
  function press(d) {
    if (!res || buf.length >= 4) return;
    buf += d; dots(); navigator.vibrate?.(5); AudioEngine.click();
    if (buf.length === 4) { const c = buf; setTimeout(() => { buf = ''; dots(); finish(c); }, 120); }
  }
  const back = () => { buf = buf.slice(0, -1); dots(); AudioEngine.click(); };
  $('pass-pad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('') + '<button data-k="x" style="font-size:15px;">Cancel</button><button data-k="0">0</button><button data-k="b">⌫</button>';
  $('pass-pad').onclick = e => { const k = e.target.dataset.k; if (!k) return; if (k === 'x') finish(null); else if (k === 'b') back(); else press(k); };
  return {
    ask({ title, sub = '', cancel = true }) {
      finish(null); buf = '';
      $('pass-title').textContent = title; $('pass-sub').textContent = sub; $('pass-pad').querySelector('[data-k="x"]').style.visibility = cancel ? 'visible' : 'hidden';
      dots(); $('passui').classList.add('show');
      return new Promise(r => res = r);
    },
    close() { finish(null); $('passui').classList.remove('show'); },
    shake() { const d = $('pass-dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); navigator.vibrate?.([40, 40, 40]); AudioEngine.error(); }
  };
})();

async function checkPass(title = 'Enter Passcode') {
  let sub = '';
  while (true) {
    const p = PassUI.ask({ title, sub });
    if (sub) PassUI.shake();
    const code = await p;
    if (code == null) { PassUI.close(); return false; }
    if (Pass.verify(code)) { AudioEngine.success(); PassUI.close(); return true; }
    sub = 'Wrong passcode';
  }
}

async function newPass() {
  let sub = `Choose a 4-digit passcode`;
  while (true) {
    const a = await PassUI.ask({ title: 'New Passcode', sub });
    if (a == null) { PassUI.close(); return false; }
    const b = await PassUI.ask({ title: 'Confirm Passcode', sub: 'Enter it again' });
    if (b == null) { PassUI.close(); return false; }
    if (a === b) { Pass.set(a); PassUI.close(); alert('Passcode saved'); return true; }
    sub = 'Passcodes didn’t match. Try again';
  }
}

/* ==================== KEYBOARD ==================== */
const Keyboard = (() => {
  const $ = id => document.getElementById(id);
  const kb = $('kb'), phone = $('phone');
  const ELIGIBLE = 'input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=button]):not([type=submit]):not([type=color]):not([readonly]):not([disabled]), textarea:not([readonly]):not([disabled])';
  const EMOJI = ['😀','😂','😍','😎','😢','😡','👍','👎','🙏','👏','🔥','❤️','🎉','✨','💯','🤔','😅','😊','😉','😘','😴','🤝','👋','🙌','💪','🌟','🎵','📷','✅','❌','⭐','🍕','☕','🚀','🌈','🐶','🐱','🎮','📞','💬'];
  const LAYERS = {
    abc: ['qwertyuiop', 'asdfghjkl', ['shift', ...'zxcvbnm', 'back']],
    num: ['1234567890', '-/:;()$&@"', ['sym', ...".,?!'", 'back']],
    sym: ['[]{}#%^*+=', '_\\|~<>€£¥•', ['num', ...".,?!'", 'back']]
  };
  let target = null, layer = 'abc', shift = 0, lastShiftTap = 0, rep = null, repT = null;

  const eligible = el => el && el.matches && el.matches(ELIGIBLE) && phone.contains(el);
  const kind = () => (target && target.type) || 'text';

  function autoCap() {
    if (shift === 2 || !target || ['password', 'email', 'url', 'number', 'tel'].includes(kind())) return;
    const s = target.selectionStart, before = s == null ? target.value : target.value.slice(0, s);
    shift = (before === '' || /[.!?]\s+$/.test(before)) ? 1 : 0;
  }
  const fire = (el, type, key) => el.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
  function insert(t) {
    const el = target; if (!el) return;
    try { const s = el.selectionStart; if (s == null) throw 0; el.setRangeText(t, s, el.selectionEnd, 'end'); }
    catch { el.value += t; }
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function back() {
    const el = target; if (!el) return;
    try {
      const s = el.selectionStart, e = el.selectionEnd; if (s == null) throw 0;
      if (s === e) { if (!s) return; const v = el.value; const n = s >= 2 && /[\uDC00-\uDFFF]/.test(v[s - 1]) && /[\uD800-\uDBFF]/.test(v[s - 2]) ? 2 : 1; el.setRangeText('', s - n, e, 'end'); }
      else el.setRangeText('', s, e, 'end');
    } catch { el.value = el.value.slice(0, -1); }
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function enter() {
    const el = target; if (!el) return;
    if (el.tagName === 'TEXTAREA') return insert('\n');
    fire(el, 'keydown', 'Enter'); fire(el, 'keypress', 'Enter'); fire(el, 'keyup', 'Enter');
  }

  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const btn = (label, k, cls = '', flex = 1) => `<button class="k ${cls}" data-k="${esc(k)}" style="flex:${flex}">${esc(label)}</button>`;
  function render() {
    if (layer === 'emo') {
      kb.innerHTML = `<div class="kb-emo">${EMOJI.map(e => `<button class="k" data-k="${e}">${e}</button>`).join('')}</div>
        <div class="kb-row">${btn('ABC', 'abc', 'sp', 2)}${btn('space', ' ', '', 5)}${btn('⌫', 'back', 'sp', 2)}</div>`;
      return;
    }
    const caps = layer === 'abc' && shift > 0;
    const rows = LAYERS[layer].map((r, i) => {
      const keys = [...(Array.isArray(r) ? r : r)].map(ch => {
        if (ch === 'shift') return btn(shift === 2 ? '⇪' : '⇧', 'shift', 'sp' + (shift ? ' on' : ''), 1.5);
        if (ch === 'back') return btn('⌫', 'back', 'sp', 1.5);
        if (ch === 'sym') return btn('#+=', 'sym', 'sp', 1.5);
        if (ch === 'num') return btn('123', 'num', 'sp', 1.5);
        return btn(caps ? ch.toUpperCase() : ch, caps ? ch.toUpperCase() : ch);
      }).join('');
      return `<div class="kb-row" style="${i === 1 && layer === 'abc' ? 'padding:0 5%;' : ''}">${keys}</div>`;
    }).join('');
    const k = kind();
    const extra = k === 'email' ? btn('@', '@') : k === 'url' ? btn('/', '/') : '';
    const bottom = layer === 'abc'
      ? btn('123', 'num', 'sp', 1.5) + btn('😀', 'emo', 'sp', 1.2) + btn('space', ' ', '', 4) + extra + btn('.', '.', '', 1) + btn('↵', 'enter', 'sp go', 1.5)
      : btn('ABC', 'abc', 'sp', 1.5) + btn('space', ' ', '', 4) + btn('↵', 'enter', 'sp go', 1.5);
    kb.innerHTML = rows + `<div class="kb-row">${bottom}</div>`;
  }

  function press(k) {
    navigator.vibrate?.(4);
    if (k === 'back') { back(); autoCap(); return render(); }
    if (k === 'enter') return enter();
    if (k === 'shift') {
      const now = Date.now(); shift = shift === 2 ? 0 : (now - lastShiftTap < 350 ? 2 : shift ? 0 : 1); lastShiftTap = now; return render();
    }
    if (['abc', 'num', 'sym', 'emo'].includes(k)) { layer = k; return render(); }
    insert(k);
    if (layer === 'abc') { if (shift === 1) shift = 0; autoCap(); render(); }
  }
  function stopRepeat() { clearTimeout(repT); clearInterval(rep); rep = repT = null; }
  
  kb.addEventListener('pointerdown', e => {
    const b = e.target.closest('.k');
    if (!b) return;
    e.preventDefault();
    const k = b.dataset.k; press(k); AudioEngine.click();
    if (k === 'back') { stopRepeat(); repT = setTimeout(() => { rep = setInterval(() => { back(); }, 55); }, 380); }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => kb.addEventListener(ev, stopRepeat));

  function show(el) {
    target = el;
    layer = ['number', 'tel'].includes(el.type) ? 'num' : 'abc';
    shift = 0; autoCap(); render();
    kb.classList.add('show'); phone.classList.add('kb-open');
    const av = document.getElementById('appview');
    if (av) av.style.bottom = kb.offsetHeight + 'px';
    setTimeout(() => { 
      if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' }); 
      const log = document.getElementById('chat-log'); 
      if (log) log.scrollTop = log.scrollHeight; 
    }, 60);
  }
  function hide() {
    stopRepeat(); target = null;
    kb.classList.remove('show'); phone.classList.remove('kb-open');
    const av = document.getElementById('appview');
    if (av) av.style.bottom = '';
  }

  document.addEventListener('pointerdown', e => { const el = e.target; if (eligible(el)) el.setAttribute('inputmode', 'none'); }, true);
  document.addEventListener('focusin', e => { const el = e.target; if (!eligible(el)) return; el.setAttribute('inputmode', 'none'); show(el); });

        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      };
      const getIcon = (type, name) => {
        if (type.startsWith('image/')) return '🖼️';

        if (type.startsWith('text/') || name.endsWith('.json') || name.endsWith('.js') || name.endsWith('.html')) return '📄';
        return '📦';

      const openDB = () => new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);

          const db = e.target.result;
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });

          const files = req.result;

        tx.oncomplete = () => { renderFiles(); navigator.vibrate?.(10); AudioEngine.success(); };
      };
      if (!db) openDB().then(() => renderFiles());
      else renderFiles();
    }
  },

const makeGameApp = () => ({ id:'game', name:'3D Cube', icon:'🎮', color:'#ff375f',
              fullscreen: true,
              body: () => `<div id="game-container" style="width:100%;height:100%;position:relative;overflow:hidden;background:#000;"><canvas id="game-canvas" style="width:100%;height:100%;display:block;touch-action:none;"></canvas><p style="position:absolute;bottom:60px;width:100%;text-align:center;color:#fff;opacity:0.5;font-size:12px;pointer-events:none;">Drag to rotate</p></div>`,
              init: () => {
                const loadThree = (cb) => { if (window.THREE) return cb(); const script = document.createElement('script'); script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'; script.onload = cb; document.head.appendChild(script); };
                loadThree(() => {
                  const container = document.getElementById('game-container');
                  const canvas = document.getElementById('game-canvas');
                  if (!container || !canvas) return;
                  const scene = new THREE.Scene();
                  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                  renderer.setSize(container.clientWidth, container.clientHeight);
                  renderer.setPixelRatio(window.devicePixelRatio);
                  const geometry = new THREE.BoxGeometry(2, 2, 2);
                  const material = new THREE.MeshStandardMaterial({ color: 0x007aff, roughness: 0.3, metalness: 0.8 });
                  const cube = new THREE.Mesh(geometry, material);
                  scene.add(cube);
                  const light = new THREE.PointLight(0xffffff, 1, 100); light.position.set(5, 5, 5); scene.add(light); scene.add(new THREE.AmbientLight(0x404040));
                  camera.position.z = 5;
                  let isDragging = false, prevX = 0, prevY = 0;
                  canvas.addEventListener('pointerdown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
                  window.addEventListener('pointerup', () => isDragging = false);
                  window.addEventListener('pointermove', e => { if (!isDragging) return; cube.rotation.y += (e.clientX - prevX) * 0.01; cube.rotation.x += (e.clientY - prevY) * 0.01; prevX = e.clientX; prevY = e.clientY; });
                  let animId;
                  const animate = () => { animId = requestAnimationFrame(animate); if (!isDragging) { cube.rotation.x += 0.005; cube.rotation.y += 0.005; } renderer.render(scene, camera); };
                  animate();
                  document.getElementById('back').addEventListener('click', () => { cancelAnimationFrame(animId); renderer.dispose(); }, { once: true });
                });
              }
            });

/* ==================== LOCAL SAVE (layout & installed apps) ==================== */
const LayoutSave = (() => {
  const KEY = 'webos-layout';
  const BUILTIN = APPS.map(a => a.id);
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(_) {}
  const save = () => {
    st.order = APPS.map(a => a.id);
    st.removed = BUILTIN.filter(id => !APPS.some(a => a.id === id));
    st.game = APPS.some(a => a.id === 'game');
    st.custom = APPS.filter(a => a._raw).map(a => a._raw);
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) { console.warn('Layout save failed', e); }
  };
  const restore = () => {
    if (!st.order) return;
    try {
      if (st.game && !APPS.some(a => a.id === 'game')) APPS.push(makeGameApp());
      (st.custom || []).forEach(raw => {
        try {
          const d = JSON.parse(raw);
          if (APPS.some(a => a.id === d.id)) return;
          if (d.js) d.init = new Function(d.js);
          d._raw = raw; APPS.push(d);
        } catch(e) { console.warn('Custom app restore failed', e); }
      });
      APPS = APPS.filter(a => !(st.removed || []).includes(a.id));
      const idx = id => { const i = st.order.indexOf(id); return i === -1 ? 1e6 : i; };
      APPS.sort((x, y) => idx(x.id) - idx(y.id));
    } catch(e) { console.warn('Layout restore failed', e); }
  };
  const setWidgetHidden = v => { st.widgetHidden = v; save(); };
  const widgetHidden = () => !!st.widgetHidden;
  const clear = () => { localStorage.removeItem(KEY); };
  return { save, restore, setWidgetHidden, widgetHidden, clear };
})();
LayoutSave.restore();

/* ==================== LONG-PRESS => EDIT MODE ==================== */
function enterEditMode() {
  const home = document.getElementById('home');
  if (home.classList.contains('edit-mode')) return;
  home.classList.add('edit-mode');
  navigator.vibrate?.(15);
  try { AudioEngine.pop(); } catch(_) {}
}
function attachLongPress(el, onTap) {
  const home = document.getElementById('home');
  let timer = null, sx = 0, sy = 0, fired = false, moved = false;
  const clear = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('contextmenu', e => { e.preventDefault(); enterEditMode(); });
  el.addEventListener('dragstart', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('del-badge')) return;
    if (home.classList.contains('edit-mode')) return;
    sx = e.clientX; sy = e.clientY; fired = false; moved = false;
    clear();
    timer = setTimeout(() => { fired = true; enterEditMode(); }, 450);
  });
  el.addEventListener('pointermove', e => {
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 12) { moved = true; clear(); }
  });
  el.addEventListener('pointerup', () => {
    const wasTimerRunning = timer !== null;
    clear();
    if (onTap && wasTimerRunning && !fired && !moved && !home.classList.contains('edit-mode')) onTap();
  });
  el.addEventListener('pointercancel', () => { if (!fired) clear(); });
}

/* ==================== HOME SCREEN & WIDGETS ==================== */
function renderHome() {
  const home = document.getElementById('home');
  home.innerHTML = '';

  // 1. Render Widget
  const widgetEl = document.createElement('div');
  widgetEl.className = 'widget';
  widgetEl.id = 'home-widget';
  widgetEl.innerHTML = `
    <div class="del-badge">✖</div>
    <div class="widget-time" id="widget-time">9:41</div>
    <div class="widget-date" id="widget-date">Tuesday, Oct 29</div>
    <div class="widget-weather">
      <span class="widget-icon">⛅</span>
      <div><strong>22°</strong><br><span style="opacity:0.7">Partly Cloudy</span></div>
    </div>
  `;

  widgetEl.querySelector('.del-badge').onclick = (e) => {
    e.stopPropagation();
    if (confirm("Remove this widget?")) {
      widgetEl.remove();
      LayoutSave.setWidgetHidden(true);
      AudioEngine.error();
    }
  };

  attachLongPress(widgetEl, null);

  home.appendChild(widgetEl);
  if (LayoutSave.widgetHidden()) widgetEl.remove();

  // 2. Render Apps
  APPS.forEach(app => {
    const el = document.createElement('div');
    el.className = 'app';
    el.dataset.id = app.id;
    el.innerHTML = `<div class="del-badge">✖</div>${makeIcon(app)}<div class="app-name">${app.name}</div>`;

    el.querySelector('.del-badge').onclick = (e) => {
      e.stopPropagation();
      if (confirm(`Uninstall ${app.name}?`)) {
        APPS = APPS.filter(a => a.id !== app.id);
        LayoutSave.save();
        renderHome();
        renderDock();
        navigator.vibrate?.(20);
        AudioEngine.error();
      }
    };

    attachLongPress(el, () => openApp(app));

    home.appendChild(el);
  });
}

/* ==================== CUSTOM DRAG AND DROP ==================== */
let draggedItem = null;
let placeholder = document.createElement('div');
placeholder.style.cssText = 'width:100%; height:100%; border-radius:14px; background:#ffffff11; grid-column: span 1;';

function initDrag() {
  const home = document.getElementById('home');

  home.addEventListener('pointerdown', (e) => {
    // FIX: let delete-badge taps through untouched (otherwise preventDefault blocks the click)
    if (e.target.classList.contains('del-badge')) return;

    const item = e.target.closest('.app, .widget');
    if (!item || !home.classList.contains('edit-mode')) return;

    e.preventDefault();
    draggedItem = item;
    const rect = item.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;

    item.style.position = 'fixed';
    item.style.left = (e.clientX - offsetX) + 'px';
    item.style.top = (e.clientY - offsetY) + 'px';
    item.style.width = rect.width + 'px';
    item.style.height = rect.height + 'px';
    item.style.zIndex = '999';
    item.style.opacity = '0.9';
    item.style.transform = 'scale(1.1)';
    item.classList.add('dragging');

    placeholder.style.width = rect.width + 'px';
    placeholder.style.height = rect.height + 'px';
    if (item.classList.contains('widget')) placeholder.style.gridColumn = 'span 2';
    else placeholder.style.gridColumn = 'span 1';
    item.parentNode.insertBefore(placeholder, item.nextSibling);

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  });

  function onPointerMove(e) {
    if (!draggedItem) return;
    e.preventDefault();

    const rect = draggedItem.getBoundingClientRect();
    const offsetX = rect.width / 2;
    const offsetY = rect.height / 2;

    draggedItem.style.left = (e.clientX - offsetX) + 'px';
    draggedItem.style.top = (e.clientY - offsetY) + 'px';

    const items = [...home.children].filter(c => c !== draggedItem && c !== placeholder);
    const target = items.find(el => {
      const r = el.getBoundingClientRect();
      return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
    });

    if (target) {
      const targetRect = target.getBoundingClientRect();
      const isAfter = (e.clientX - targetRect.left) > targetRect.width / 2;
      if (isAfter) target.parentNode.insertBefore(placeholder, target.nextSibling);
      else target.parentNode.insertBefore(placeholder, target);
    }
  }

  function onPointerUp() {
    if (!draggedItem) return;

    draggedItem.style.position = '';
    draggedItem.style.left = '';
    draggedItem.style.top = '';
    draggedItem.style.width = '';
    draggedItem.style.height = '';
    draggedItem.style.zIndex = '';
    draggedItem.style.opacity = '';
    draggedItem.style.transform = '';
    draggedItem.classList.remove('dragging');

    if (placeholder.parentNode) placeholder.parentNode.insertBefore(draggedItem, placeholder);
    placeholder.remove();

    const newOrder = [...document.querySelectorAll('#home .app')].map(el => el.dataset.id);
    APPS.sort((a, b) => {
      const ai = newOrder.indexOf(a.id), bi = newOrder.indexOf(b.id);
      if (ai === -1) return 1; if (bi === -1) return -1;
      return ai - bi;
    });
    LayoutSave.save();

    draggedItem = null;
    AudioEngine.pop();
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
  }
}
initDrag();

document.getElementById('home').addEventListener('pointerdown', (e) => {
  if (e.target.id === 'home' && e.target.classList.contains('edit-mode')) {
    e.target.classList.remove('edit-mode');
    const newOrder = [...document.querySelectorAll('#home .app')].map(el => el.dataset.id);
    APPS.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
    LayoutSave.save();
  }
});

/* ==================== DOCK ==================== */
function renderDock() {
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  DOCK_APPS.forEach(id => {
    const app = APPS.find(a => a.id === id);
    if (!app) return;
    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML = makeIcon(app);
    attachLongPress(el, () => openApp(app));
    dock.appendChild(el);
  });
}
renderDock();
renderHome();

/* ==================== DEVELOPER OPTIONS ==================== */
const DevOpts = (() => {
  const KEY = 'webos-dev';
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(_) {}
  const phone = () => document.getElementById('phone');
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(_) {} };
  const get = id => !!st[id];

  // --- Show touches
  const dots = {};
  const touchDown = e => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#0a84ff66;border:2px solid #0a84ff;pointer-events:none;z-index:99999;left:'+e.clientX+'px;top:'+e.clientY+'px'; document.body.appendChild(d); dots[e.pointerId] = d; };
  const touchMove = e => { const d = dots[e.pointerId]; if (d) { d.style.left = e.clientX+'px'; d.style.top = e.clientY+'px'; } };
  const touchUp = e => { const d = dots[e.pointerId]; if (d) { d.remove(); delete dots[e.pointerId]; } };
  // --- FPS
  let fpsEl = null, fpsRaf = 0;
  const fpsStart = () => {
    fpsEl = document.createElement('div');
    fpsEl.style.cssText = 'position:fixed;top:4px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:8px;background:#000a;color:#34c759;font:11px monospace;z-index:99998;pointer-events:none';
    document.body.appendChild(fpsEl);
    let last = performance.now(), frames = 0;
    const loop = t => { frames++; if (t - last >= 500) { fpsEl.textContent = Math.round(frames * 1000 / (t - last)) + ' FPS'; frames = 0; last = t; } fpsRaf = requestAnimationFrame(loop); };
    fpsRaf = requestAnimationFrame(loop);
  };
  const fpsStop = () => { cancelAnimationFrame(fpsRaf); fpsEl?.remove(); fpsEl = null; };
  // --- Console overlay
  const logs = [];
  let conEl = null;
  const fmt = a => { try { return typeof a === 'string' ? a : (a instanceof Error ? a.stack || a.message : JSON.stringify(a)); } catch(_) { return String(a); } };
  const push = (type, args) => { logs.push([type, args.map(fmt).join(' ')]); if (logs.length > 200) logs.shift(); renderCon(); };
  ['log','warn','error','info'].forEach(m => { const o = console[m].bind(console); console[m] = (...a) => { o(...a); push(m, a); }; });
  window.addEventListener('error', e => push('error', [e.message + ' (' + (e.lineno||'?') + ')']));
  window.addEventListener('unhandledrejection', e => push('error', ['Promise: ' + fmt(e.reason)]));
  const renderCon = () => {
    if (!conEl) return;
    conEl.querySelector('.dev-log').innerHTML = logs.map(([t, m]) => '<div style="color:' + ({error:'#ff453a',warn:'#ffd60a',info:'#64d2ff'}[t] || '#ddd') + ';border-bottom:1px solid #ffffff10;padding:2px 0;">' + m.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>').join('');
    const l = conEl.querySelector('.dev-log'); l.scrollTop = l.scrollHeight;
  };
  const conStart = () => {
    conEl = document.createElement('div');
    conEl.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:35%;background:#000d;color:#ddd;font:11px monospace;z-index:99997;display:flex;flex-direction:column;border-top:1px solid #ffffff30;';
    conEl.innerHTML = '<div style="display:flex;justify-content:space-between;padding:4px 8px;background:#1c1c22;"><span>Console</span><span class="dev-clear" style="color:#ff375f;cursor:pointer;">Clear</span></div><div class="dev-log" style="flex:1;overflow:auto;padding:4px 8px;user-select:text;"></div>';
    conEl.querySelector('.dev-clear').onclick = () => { logs.length = 0; renderCon(); };
    document.body.appendChild(conEl); renderCon();
  };
  const conStop = () => { conEl?.remove(); conEl = null; };

  const styleEl = document.createElement('style'); document.head.appendChild(styleEl);
  const apply = id => {
    const on = get(id);
    if (id === 'dev-touch') ['pointerdown','pointermove','pointerup','pointercancel'].forEach((ev, i) => document[on ? 'addEventListener' : 'removeEventListener'](ev, [touchDown, touchMove, touchUp, touchUp][i], true));
    if (id === 'dev-fps') on ? (!fpsEl && fpsStart()) : fpsStop();
    if (id === 'dev-console') on ? (!conEl && conStart()) : conStop();
    styleEl.textContent =
      (get('dev-borders') ? '#phone *{outline:1px solid rgba(255,69,58,.45)!important}' : '') +
      (get('dev-noanim') ? '*,*::before,*::after{animation:none!important;transition:none!important}' : '');
  };
  const IDS = ['dev-touch','dev-fps','dev-borders','dev-noanim','dev-console','dev-mute'];
  const initAll = () => IDS.forEach(apply);

  const bind = () => {
    IDS.forEach(id => { const el = document.getElementById(id); if (el) el.onchange = () => { st[id] = el.checked; save(); apply(id); }; });
    document.getElementById('dev-edit').onclick = () => { closeApp(); setTimeout(enterEditMode, 400); };
    document.getElementById('dev-reset').onclick = () => { if (confirm('Erase all WebOS data and reload?')) { localStorage.clear(); location.reload(); } };
    document.getElementById('dev-info').textContent =
      'Viewport: ' + innerWidth + 'x' + innerHeight + ' @' + devicePixelRatio + 'x\n' +
      'Apps installed: ' + APPS.length + '\n' +
      'Touch: ' + (navigator.maxTouchPoints > 0) + '\n' +
      'UA: ' + navigator.userAgent;
  };
  return { get, bind, initAll, muted: () => get('dev-mute') };
})();

DevOpts.initAll();

/* ==================== SLIDE TO UNLOCK ==================== */
const lockscreen = document.getElementById('lockscreen');
const wallpaper  = document.getElementById('wallpaper');
const slider     = document.getElementById('slider');
const handle     = document.getElementById('slider-handle');
const sliderFill = document.getElementById('slider-fill');

let dragging = false, startX = 0, maxX = 0, unlocked = false;
const getMaxX = () => slider.clientWidth - handle.offsetWidth - 10;

handle.addEventListener('pointerdown', e => {
  if (unlocked) return;
  dragging = true; startX = e.clientX; maxX = getMaxX();
  handle.classList.add('dragging');
  try { handle.setPointerCapture(e.pointerId); } catch(_){}
});
handle.addEventListener('pointermove', e => {
  if (!dragging) return;
  const x = Math.max(0, Math.min(maxX, e.clientX - startX));
  handle.style.left = (5 + x) + 'px';
  sliderFill.style.width = (5 + x + handle.offsetWidth) + 'px';
  if (x >= maxX - 2) unlock();
});
const resetSlider = () => {
  handle.classList.remove('dragging');
  handle.style.left = '5px';
  sliderFill.style.width = '0';
};
handle.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false; handle.classList.remove('dragging');
  const left = parseFloat(handle.style.left) || 5;
  if (left < maxX - 5 && !unlocked) resetSlider();
});
handle.addEventListener('pointercancel', () => { dragging = false; if (!unlocked) resetSlider(); });

async function unlock() {
  if (unlocked) return;
  unlocked = true; dragging = false;
  handle.classList.remove('dragging'); navigator.vibrate?.(15);
  handle.style.left = (5 + maxX) + 'px'; sliderFill.style.width = '100%';
  AudioEngine.swoosh();
  setTimeout(async () => {
    if (Pass.has()) {
      const ok = await checkPass('Enter Passcode');
      if (!ok) { unlocked = false; resetSlider(); return; }
    }
    lockscreen.classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
    document.getElementById('dock').classList.remove('hidden');
    wallpaper.classList.remove('blur');
    const b = localStorage.getItem('webos-bright');
    if (b) wallpaper.style.filter = `brightness(${b}%)`;
    resetSlider();
  }, 200);
}

/* ==================== APP LAUNCHER ==================== */
const appview = document.getElementById('appview');
const appTitle = document.getElementById('app-title');
const appContent = document.getElementById('app-content');
let currentApp = null;

function openApp(app) {
  if (!app) return;
  if (document.getElementById('home').classList.contains('edit-mode')) return;
  Keyboard.hide();
  currentApp = app;
  appTitle.textContent = app.name;
  appContent.innerHTML = typeof app.body === 'function' ? app.body() : app.body;
  if (app.fullscreen) {
    appContent.style.padding = '0';
    appContent.style.overflow = 'hidden';
  } else {
    appContent.style.padding = '20px';
    appContent.style.overflow = 'auto';
  }
  appview.style.bottom = '';
  appview.classList.add('open');
  navigator.vibrate?.(5);
  AudioEngine.pop();
  if (app.init) setTimeout(() => { try { app.init(); } catch(e) { console.error(e); } }, 0);
}

function closeApp() {
  Keyboard.hide();
  appview.classList.remove('open');
  appview.style.bottom = '';
  AudioEngine.click();
  if (currentApp && currentApp.id === 'camera') {
    const stopBtn = document.getElementById('cam-stop');
    if (stopBtn && stopBtn.style.display !== 'none') stopBtn.click();
  }
  if (currentApp && currentApp.id === 'messages' && window.closeChatRoom) {
    window.closeChatRoom();
  }
  currentApp = null;
}
document.getElementById('back').onclick = closeApp;

window.openApp = openApp;
window.closeApp = closeApp;
window.renderHome = renderHome;
window.renderDock = renderDock;
Object.defineProperty(window, 'APPS', { get: () => APPS });

/* ==================== SWIPE UP GESTURE ==================== */
const indicator = document.getElementById('indicator');
let indDragging = false, indStartY = 0;

indicator.addEventListener('pointerdown', e => {
  indDragging = true; indStartY = e.clientY;
  indicator.style.cursor = 'grabbing';
  e.stopPropagation();
});
indicator.addEventListener('pointermove', e => {
  if (!indDragging) return;
  const deltaY = e.clientY - indStartY;
  if (deltaY < -20) {
    indDragging = false; indicator.style.cursor = 'grab';
    if (appview.classList.contains('open')) {
      navigator.vibrate?.(10);
      closeApp();
    }
  }
});
indicator.addEventListener('pointerup', () => { indDragging = false; indicator.style.cursor = 'grab'; });
indicator.addEventListener('pointercancel', () => { indDragging = false; indicator.style.cursor = 'grab'; });

/* ==================== CLOCK & WIDGET TICK ==================== */
function tick() {
  const d = new Date();
  const t = d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const dt = d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  document.getElementById('clock').textContent = t;
  document.getElementById('lock-time').textContent = t;
  document.getElementById('lock-date').textContent = d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  if (document.getElementById('widget-time')) {
    document.getElementById('widget-time').textContent = t;
    document.getElementById('widget-date').textContent = dt;
  }
}
tick(); setInterval(tick, 10000);

/* ==================== RESIZE ==================== */
window.addEventListener('resize', () => {
  if (!unlocked) maxX = getMaxX();
  if (!dragging && !unlocked) resetSlider();
});
</script>
